<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Wheel of Coffee</title>
<link rel="icon" type="image/png" href="icon.png">
<!--
  Wheel of Coffee - a puzzle board game for a host and up to four contestants.
  Written for old Android WebViews (Android 4.2 / WebKit 534): ES5 only,
  -webkit- prefixed CSS, no flexbox, no calc(), no vh/vw units.
-->
<style>
@font-face{font-family:'WOCBoard';src:url('fonts/Arimo-Bold.ttf') format('truetype');font-weight:normal;font-style:normal}
@font-face{font-family:'WOCNum';src:url('fonts/Oswald-Bold.ttf') format('truetype');font-weight:normal;font-style:normal}
@font-face{font-family:'WOCUi';src:url('fonts/Oswald-Medium.ttf') format('truetype');font-weight:normal;font-style:normal}
@font-face{font-family:'WOCLogo';src:url('fonts/Lobster-Regular.ttf') format('truetype');font-weight:normal;font-style:normal}

*{margin:0;padding:0;-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0d06}
body{font-family:'WOCUi',sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:none}
#app{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:none;overflow:hidden}
.screen.show{display:block}
.coffee{background:#3a1d0c;background:-webkit-radial-gradient(50% 35%,ellipse cover,#86522c 0%,#4a2610 45%,#1c0c04 100%);background:radial-gradient(ellipse at 50% 35%,#86522c 0%,#4a2610 45%,#1c0c04 100%)}
#game.bonus{background:#050302;background:-webkit-radial-gradient(50% 30%,ellipse cover,#2a170c 0%,#0c0604 55%,#000 100%);background:radial-gradient(ellipse at 50% 30%,#2a170c 0%,#0c0604 55%,#000 100%)}
.cf:after{content:'';display:block;clear:both}
.l{float:left}
.r{float:right}

/* ---------- puzzle board ---------- */
#board{position:absolute}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:.45em;background:#2a1408;background:-webkit-linear-gradient(top,#4b2a14,#24110a);background:linear-gradient(to bottom,#4b2a14,#24110a);border:.22em solid #c8913f;box-shadow:0 0 0 .1em #5a3311,0 .3em 1em rgba(0,0,0,.6),inset 0 0 .7em rgba(0,0,0,.7)}
#game.bonus #frame{border-color:#6e5126;background:#140a05;background:-webkit-linear-gradient(top,#22130a,#0c0604);background:linear-gradient(to bottom,#22130a,#0c0604);box-shadow:0 0 0 .1em #2a1808,0 .3em 1.2em rgba(0,0,0,.9),inset 0 0 .7em rgba(0,0,0,.8)}
.tile{position:absolute;border-radius:.08em;overflow:hidden;text-align:center;background:#1c9a4a;background:-webkit-linear-gradient(top,#2fc062 0%,#1a9445 55%,#117334 100%);background:linear-gradient(to bottom,#2fc062 0%,#1a9445 55%,#117334 100%);box-shadow:inset 0 0 0 .03em rgba(0,0,0,.45),inset 0 .05em 0 rgba(255,255,255,.25)}
#game.bonus .tile{background:#157a3a;background:-webkit-linear-gradient(top,#23a050 0%,#147a39 55%,#0c5a29 100%);background:linear-gradient(to bottom,#23a050 0%,#147a39 55%,#0c5a29 100%)}
.tile.off{visibility:hidden}
.tile.pz,#game.bonus .tile.pz{background:#f2f2ee;background:-webkit-linear-gradient(top,#ffffff,#e2e2dc);background:linear-gradient(to bottom,#ffffff,#e2e2dc)}
.tile.lit,#game.bonus .tile.lit{background:#e2231a;background:-webkit-linear-gradient(top,#ff5a48,#cf160e);background:linear-gradient(to bottom,#ff5a48,#cf160e);box-shadow:0 0 .3em #ff3b2b,inset 0 0 0 .03em rgba(0,0,0,.4)}
.tile.on,#game.bonus .tile.on{background:#fff;background:-webkit-linear-gradient(top,#ffffff,#ececea);background:linear-gradient(to bottom,#ffffff,#ececea)}
.tile b{display:none;font-family:'WOCBoard',Arial,sans-serif;font-weight:normal;color:#111}
.tile.on b{display:block}

/* ---------- category bar ---------- */
#catbar{position:absolute;text-align:center;border-radius:.25em;background:#2a1408;background:-webkit-linear-gradient(top,#4a2812,#1e0e05);background:linear-gradient(to bottom,#4a2812,#1e0e05);border:.08em solid #d9a25a;box-shadow:0 .1em .4em rgba(0,0,0,.6);color:#ffe9c2;font-family:'WOCNum',sans-serif;letter-spacing:.12em;white-space:nowrap;overflow:hidden}
#game.bonus #catbar{border-color:#8a6a35;background:#120904}

/* ---------- letter selection board ---------- */
.key{position:absolute;text-align:center;border-radius:.16em;font-family:'WOCBoard',Arial,sans-serif;color:#3a1d0c;background:#f7ead2;background:-webkit-linear-gradient(top,#fff7e8,#e6cc9f);background:linear-gradient(to bottom,#fff7e8,#e6cc9f);box-shadow:0 .07em 0 #7a4b22,0 .12em .2em rgba(0,0,0,.45)}
.key.v{background:#ffd56b;background:-webkit-linear-gradient(top,#ffe49a,#efb02c);background:linear-gradient(to bottom,#ffe49a,#efb02c)}
.key.pressed{-webkit-transform:translate(0,.05em);transform:translate(0,.05em)}
.key.used{visibility:hidden}

/* ---------- side panels ---------- */
.side{position:absolute;text-align:center;overflow:hidden}
.logo{font-family:'WOCLogo',cursive;color:#ffe2a8;line-height:1.3;white-space:nowrap;text-shadow:0 .05em 0 #6b3a14,0 0 .3em rgba(255,190,90,.45)}
.side .logo{font-size:1.45em;margin-bottom:.15em}
#game.bonus .logo{color:#ffd27a}
.sb{position:relative;height:3.6em;margin-bottom:.3em;border-radius:.35em;padding:.15em .5em;opacity:.5;border:.14em solid rgba(0,0,0,.35);overflow:hidden;text-align:left;color:#fff}
.sb.act{opacity:1;border-color:#fff;box-shadow:0 0 .5em rgba(255,255,255,.85)}
.red{background:#d9302a;background:-webkit-linear-gradient(top,#ef5148,#a3150f);background:linear-gradient(to bottom,#ef5148,#a3150f)}
.yellow{background:#f5c518;background:-webkit-linear-gradient(top,#ffe066,#d39d00);background:linear-gradient(to bottom,#ffe066,#d39d00)}
.blue{background:#2a74d6;background:-webkit-linear-gradient(top,#4a95f2,#1650a8);background:linear-gradient(to bottom,#4a95f2,#1650a8)}
.green{background:#2fa84f;background:-webkit-linear-gradient(top,#46cc6a,#167a33);background:linear-gradient(to bottom,#46cc6a,#167a33)}
.sb.yellow{color:#2a1a00}
.sbName{font-size:.8em;line-height:1.25em;white-space:nowrap;overflow:hidden;margin-right:6.5em;letter-spacing:.03em}
.sbTot{position:absolute;right:.6em;top:.35em;font-size:.62em;opacity:.9;letter-spacing:.04em}
.sbRound{font-family:'WOCNum',sans-serif;font-size:1.6em;line-height:1.3em;text-align:center}
#status{height:3.6em;margin-bottom:.45em;border-radius:.35em;background:rgba(0,0,0,.38);border:.12em solid rgba(255,226,168,.35);padding:.1em .3em;overflow:hidden}
#stBig{font-family:'WOCNum',sans-serif;font-size:1.2em;line-height:1.2em;height:1.2em;color:#ffe2a8;white-space:nowrap;overflow:hidden}
#stSmall{font-size:.7em;line-height:1.2em;color:#f3dcc0;height:2.4em;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:block;border-radius:.35em;text-align:center;font-family:'WOCNum',sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 .06em 0 rgba(0,0,0,.45);box-shadow:0 .15em 0 rgba(0,0,0,.45),inset 0 .08em 0 rgba(255,255,255,.3);white-space:nowrap;overflow:hidden;cursor:pointer}
.btn.pressed{-webkit-transform:translate(0,.1em);transform:translate(0,.1em);box-shadow:0 .05em 0 rgba(0,0,0,.45)}
.btn.dis{opacity:.35}
.btn.gold{color:#3a1d00;text-shadow:0 .06em 0 rgba(255,255,255,.4);background:#f5b52e;background:-webkit-linear-gradient(top,#ffd862,#e48a08);background:linear-gradient(to bottom,#ffd862,#e48a08)}
.btn.green{background:#2fa84f;background:-webkit-linear-gradient(top,#46cc6a,#167a33);background:linear-gradient(to bottom,#46cc6a,#167a33)}
.btn.red{background:#d9302a;background:-webkit-linear-gradient(top,#ef5148,#a3150f);background:linear-gradient(to bottom,#ef5148,#a3150f)}
.btn.brown{background:#6e4322;background:-webkit-linear-gradient(top,#93603a,#4e2c14);background:linear-gradient(to bottom,#93603a,#4e2c14)}
.xl{font-size:1.5em;height:1.9em;line-height:1.9em;margin-bottom:.3em}
.lg{font-size:1.2em;height:1.9em;line-height:1.9em;margin-bottom:.38em}
.md{font-size:1em;height:2.3em;line-height:2.3em}
.sm{font-size:.85em;height:2.4em;line-height:2.4em}
.half{width:48.5%}

/* portrait fallback (the APK is locked to landscape) */
#game.port .col1{float:left;width:49%}
#game.port .col2{float:right;width:49%}
#game.port .side .logo{display:none}

/* ---------- bonus round panel ---------- */
#bCard{background:#120904;background:-webkit-linear-gradient(top,#2a160a,#0d0603);background:linear-gradient(to bottom,#2a160a,#0d0603);border:.14em solid #c8913f;border-radius:.45em;padding:.35em .2em .45em;margin-bottom:.45em;box-shadow:0 0 .8em rgba(0,0,0,.8)}
#bCat{font-family:'WOCNum',sans-serif;font-size:.85em;color:#ffe2a8;letter-spacing:.08em;line-height:1.35em;height:1.35em;overflow:hidden;white-space:nowrap;margin-bottom:.25em}
.bRow{height:2em;margin-top:.2em;white-space:nowrap}
.ct{display:inline-block;vertical-align:top;font-family:'WOCBoard',Arial,sans-serif;font-size:1.1em;width:1.3em;height:1.65em;line-height:1.65em;margin:0 .06em;border-radius:.12em;color:#111;background:#fff;background:-webkit-linear-gradient(top,#ffffff,#e2e2dc);background:linear-gradient(to bottom,#ffffff,#e2e2dc)}
.ct.empty{background:transparent;border:.08em dashed rgba(255,226,168,.55)}
.plus{display:inline-block;vertical-align:top;font-family:'WOCNum',sans-serif;color:#ffe2a8;font-size:1.1em;line-height:1.65em;margin:0 .12em}
#bTimerRow{height:3.6em;margin-bottom:.45em}
#bTimer{float:left;width:3.6em;height:3.6em;border-radius:50%;background:#140a05;border:.18em solid #d9a25a;text-align:center;box-shadow:inset 0 0 .5em rgba(0,0,0,.8)}
#bTimer span{display:block;font-family:'WOCNum',sans-serif;font-size:2.1em;line-height:1.54em;color:#ffe9c2}
#bTimer.run{border-color:#ff5a48;box-shadow:0 0 .6em #ff3b2b,inset 0 0 .5em rgba(0,0,0,.8)}
#bTimer.zero{border-color:#a3150f}
#bTimer.zero span{color:#ff4a3a}
#bTimer.won{border-color:#46cc6a}
#bTimer.won span{color:#7dff9c}
#bBtnTimer{margin:.65em 0 0 4.1em}

/* ---------- wheel overlay ---------- */
#wheelOv{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;z-index:50}
#wheelWrap{position:absolute}
#wheelWrap.pop{-webkit-animation:pop .3s ease-out;animation:pop .3s ease-out}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.4);opacity:0}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
#wheel{position:absolute;left:0;top:0;-webkit-transform-origin:50% 50%;transform-origin:50% 50%}
#pointer,#pointerB{position:absolute;width:0;height:0;border-style:solid;border-color:#ffd447 transparent transparent transparent}
#pointerB{border-color:#5a3311 transparent transparent transparent}
#wheelRes{position:absolute;font-family:'WOCNum',sans-serif;text-align:center;border-radius:.2em;display:none;white-space:nowrap;letter-spacing:.04em;box-shadow:0 0 .4em rgba(0,0,0,.8)}
#wheelRes.val{background:#ffd447;color:#2b1709;border:.06em solid #fff}
#wheelRes.bankrupt{background:#000;color:#fff;border:.06em solid #fff}
#wheelRes.lose{background:#fff;color:#000;border:.06em solid #000}
#wheelWho{position:absolute;left:0;top:0;font-family:'WOCNum',sans-serif;padding:.2em .6em;border-radius:.3em;letter-spacing:.04em}

/* ---------- toast, confetti, modal ---------- */
#toast{position:absolute;left:0;top:0;padding:.35em .9em;border-radius:.35em;background:rgba(20,10,4,.93);border:.1em solid #ffcf6b;color:#fff;font-family:'WOCNum',sans-serif;letter-spacing:.04em;text-align:center;white-space:nowrap;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;pointer-events:none;z-index:70}
#toast.show{opacity:1}
#confetti{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;display:none;z-index:60}
#confetti i{position:absolute;top:-30px;display:block;-webkit-animation-timing-function:linear;animation-timing-function:linear;-webkit-animation-fill-mode:both;animation-fill-mode:both}
#modal{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:none;z-index:90}
#mbox{position:absolute;top:2%;max-height:96%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#2b1709;border:.15em solid #d9a25a;border-radius:.5em;padding:.7em .8em .9em;font-family:Arial,Helvetica,sans-serif;box-shadow:0 .5em 2em rgba(0,0,0,.7)}
.mtitle{font-family:'WOCNum',sans-serif;font-size:1.3em;text-align:center;line-height:1.7em;color:#ffe2a8;white-space:nowrap;overflow:hidden}
.mmsg{font-family:'WOCUi',sans-serif;font-size:1.15em;text-align:center;color:#ffe9c7;margin:.5em 0 1em;line-height:1.35em}
.mb{font-size:.95em;height:2.2em;line-height:2.2em;width:6.5em}
.mlbl{font-family:'WOCUi',sans-serif;color:#e9c99a;margin:.6em 0 .25em;font-size:.95em;letter-spacing:.04em}
.hint{font-family:Arial,sans-serif;color:#b8956a;font-size:.85em;letter-spacing:0}
.chips{margin-top:.4em}
.chip{display:inline-block;font-family:'WOCUi',sans-serif;font-size:.78em;padding:.3em .65em;margin:0 .3em .35em 0;border-radius:1em;background:#5a3418;color:#ffe9c7;border:.1em solid #8a5a2c}
.chip.pressed{background:#d9a25a;color:#2b1709}
.tog{float:left;font-family:'WOCUi',sans-serif;font-size:.85em;padding:.4em .8em;margin:.55em .5em 0 0;border-radius:.3em;background:#4a2a12;border:.1em solid #8a5a2c;color:#ffe9c7}
.tog.on{background:#d9a25a;color:#2b1709}
#mErr{color:#ff9a8a;font-size:.9em;min-height:1.3em;margin:.45em 0 .25em}
#prev{position:relative;width:100%;max-width:24em;margin:0 auto}
.mitem{font-size:1.15em;height:2.3em;line-height:2.3em;margin-top:.5em}
.erow{margin:.4em 0;white-space:nowrap}
.erow .fld{display:inline-block;vertical-align:middle;width:26%;margin-left:2%}
.erow .fld.en{width:38%;margin-left:0;border-left-width:.5em}

/* ---------- text fields + on-screen keyboard (no system text inputs) ---------- */
.fld{position:relative;height:2.1em;line-height:1.4em;padding:.25em .45em;border-radius:.25em;border:.1em solid #b98a4e;background:#fff8ec;color:#2b1709;font-family:Arial,Helvetica,sans-serif;font-size:1em;white-space:nowrap;overflow:hidden;cursor:text}
.fld.focus{border-color:#ffb02e;box-shadow:0 0 0 .15em rgba(255,176,46,.55)}
.fld span.ph{color:#a88760}
.fld.sel span{background:#ffd27a;color:#2b1709}
.caret{display:none;width:.1em;height:1.2em;margin-left:.06em;vertical-align:-.22em;background:currentColor;-webkit-animation:blink 1s steps(1) infinite;animation:blink 1s steps(1) infinite}
.fld.focus .caret{display:inline-block}
@-webkit-keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
#kb{position:absolute;left:0;bottom:0;width:100%;display:none;z-index:100;background:#1a0d06;background:-webkit-linear-gradient(top,#3a2010,#140904);background:linear-gradient(to bottom,#3a2010,#140904);border-top:.1em solid #d9a25a;box-shadow:0 -.3em 1em rgba(0,0,0,.6)}
.kk{position:absolute;text-align:center;border-radius:.16em;color:#3a1d0c;font-family:'WOCBoard',Arial,sans-serif;white-space:nowrap;overflow:hidden;background:#f7ead2;background:-webkit-linear-gradient(top,#fff7e8,#e6cc9f);background:linear-gradient(to bottom,#fff7e8,#e6cc9f);box-shadow:0 .08em 0 #7a4b22}
.kk.fn{font-family:'WOCNum',sans-serif;font-size:.62em;letter-spacing:.06em;color:#fff;text-shadow:0 .06em 0 rgba(0,0,0,.45);background:#6e4322;background:-webkit-linear-gradient(top,#93603a,#4e2c14);background:linear-gradient(to bottom,#93603a,#4e2c14)}
.kk.go{background:#2fa84f;background:-webkit-linear-gradient(top,#46cc6a,#167a33);background:linear-gradient(to bottom,#46cc6a,#167a33)}
.kk.on{color:#3a1d00;text-shadow:none;background:#f5b52e;background:-webkit-linear-gradient(top,#ffd862,#e48a08);background:linear-gradient(to bottom,#ffd862,#e48a08)}
.kk.pressed{background:#ffd862;color:#3a1d00}
.kk.dis{opacity:.28}
.ehead{font-family:'WOCUi',sans-serif;color:#e9c99a;font-size:.85em;white-space:nowrap}
.ehead span{display:inline-block;width:26%;margin-left:2%}
.ehead span.en{width:38%;margin-left:0}

/* ---------- setup screen ---------- */
#setup{overflow-y:auto;-webkit-overflow-scrolling:touch}
#setupIn{margin:0 auto;padding:.6em 0 1.5em;text-align:center}
#setupLogo{font-size:3.2em}
.tagline{font-family:'WOCUi',sans-serif;color:#e9c99a;letter-spacing:.25em;font-size:.8em;margin:-.2em 0 .6em}
.slbl{font-family:'WOCUi',sans-serif;color:#ffe2a8;font-size:1.05em;margin:.7em 0 .4em;letter-spacing:.05em}
.cnt{display:inline-block;width:2.2em;height:2.2em;line-height:2.1em;margin:0 .3em;border-radius:50%;background:#4a2a12;border:.12em solid #8a5a2c;font-family:'WOCNum',sans-serif;font-size:1.2em;color:#ffe9c7}
.cnt.sel{background:#f0b432;color:#2b1709;border-color:#fff}
.prow{margin:.45em auto;text-align:left;width:22.8em;white-space:nowrap}
.prow .fld{display:inline-block;width:11em;vertical-align:middle}
.plbl{display:inline-block;width:1.4em;font-family:'WOCNum',sans-serif;color:#ffe2a8;vertical-align:middle}
.sw{display:inline-block;width:2em;height:2em;border-radius:50%;margin-left:.45em;vertical-align:middle;border:.15em solid rgba(0,0,0,.4)}
.sw.sel{border-color:#fff;box-shadow:0 0 0 .12em rgba(255,255,255,.45),0 0 .5em #fff}
#btnStart{width:11em;margin:1em auto 0}
#resumeWrap .btn{width:13em;margin:0 auto .3em}
#fontLoad{position:absolute;left:-9999px;top:-9999px;visibility:hidden}
</style>
</head>
<body>
<div id="app">

  <!-- ===== setup screen ===== -->
  <div id="setup" class="screen coffee scroll">
    <div id="setupIn">
      <div id="setupLogo" class="logo">Wheel of Coffee</div>
      <div class="tagline">FRESHLY BREWED PUZZLES</div>
      <div id="resumeWrap"><div id="btnResume" class="btn gold lg">RESUME SAVED GAME</div></div>
      <div class="slbl">How many contestants?</div>
      <div id="countRow"></div>
      <div class="slbl">Names and colours</div>
      <div id="pRows"></div>
      <div id="btnStart" class="btn green xl">START GAME</div>
    </div>
  </div>

  <!-- ===== game screen (regular rounds + bonus round) ===== -->
  <div id="game" class="screen coffee">
    <div id="board"><div id="frame"></div></div>
    <div id="catbar"><span id="catText"></span></div>
    <div id="keys"></div>

    <div id="side" class="side cf"><div class="sideIn cf">
      <div class="logo">Wheel of Coffee</div>
      <div id="scores" class="col1"></div>
      <div class="col2">
        <div id="status"><div id="stBig"></div><div id="stSmall"></div></div>
        <div id="btnSpin" class="btn gold xl">SPIN</div>
        <div id="btnSolve" class="btn green lg">SOLVED</div>
        <div class="cf"><div id="btnPass" class="btn brown sm half l">PASS TURN</div><div id="btnMenu" class="btn brown sm half r">MENU</div></div>
      </div>
    </div></div>

    <div id="bside" class="side cf"><div class="sideIn cf">
      <div class="logo">Bonus Round</div>
      <div class="col1">
        <div id="bCard">
          <div id="bCat"></div>
          <div class="bRow"><span class="ct">R</span><span class="ct">S</span><span class="ct">T</span><span class="ct">L</span><span class="ct">N</span><span class="ct">E</span></div>
          <div class="bRow" id="bPick"></div>
        </div>
      </div>
      <div class="col2">
        <div id="bBtnRst" class="btn red lg">R S T L N E</div>
        <div id="bBtnRev" class="btn gold lg">REVEAL LETTERS</div>
        <div id="bTimerRow"><div id="bTimer"><span>10</span></div><div id="bBtnTimer" class="btn brown md">START TIMER</div></div>
        <div id="bBtnSolve" class="btn green xl">SOLVED</div>
        <div class="cf"><div id="bBtnLoad" class="btn brown sm half l">LOAD PUZZLE</div><div id="bBtnMenu" class="btn brown sm half r">MENU</div></div>
      </div>
    </div></div>
  </div>

  <!-- ===== overlays ===== -->
  <div id="wheelOv">
    <div id="wheelWho"></div>
    <div id="wheelWrap"><canvas id="wheel" width="10" height="10"></canvas><div id="pointerB"></div><div id="pointer"></div></div>
    <div id="wheelRes"></div>
  </div>
  <div id="confetti"></div>
  <div id="toast"></div>
  <div id="modal"><div id="mbox" class="scroll"><div id="prev"></div></div></div>
  <div id="kb"></div>
  <style id="cfStyle"></style>
  <div id="fontLoad"><span style="font-family:WOCBoard">A</span><span style="font-family:WOCNum">1</span><span style="font-family:WOCUi">a</span><span style="font-family:WOCLogo">W</span></div>
</div>

<script>
(function () {

var COLS = 14, ROWS = 4;
var COLORS = ['red', 'yellow', 'blue', 'green'];
var CNAME = { red: 'Red', yellow: 'Yellow', blue: 'Blue', green: 'Green' };
var CHEX = { red: '#ef5148', yellow: '#ffd23f', blue: '#4a95f2', green: '#46cc6a' };
var VOWELS = 'AEIOU', ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', RSTLNE = 'RSTLNE';
var REG_ROWS = ['BCDFGHJKLMN', 'PQRSTVWXYZ', 'AEIOU'];
var BON_ROWS = ['BCDFGHJK', 'MPQVWXYZ', 'AIOU'];
var SPECIAL = { 5: 'bankrupt', 17: 'bankrupt', 11: 'lose', 23: 'lose' };
var WEDGE = ['#e3342f', '#f6851f', '#f9d71c', '#38b24a', '#1f78d1', '#8e44ad', '#ec5fa3'];
var DARK_TEXT = { '#f6851f': 1, '#f9d71c': 1 };
var CATS = ['PHRASE', 'THING', 'THINGS', 'PLACE', 'PERSON', 'PEOPLE', 'FOOD & DRINK', 'BEFORE & AFTER',
  'WHAT ARE YOU DOING?', 'AROUND THE HOUSE', 'FUN & GAMES', 'EVENT', 'SAME NAME', 'SHOW BIZ', 'TITLE',
  'LANDMARK', 'LIVING THING', 'OCCUPATION', 'RHYME TIME', 'QUOTATION'];
var STORE = 'wheelOfCoffee.save.v1';

var S = null;            // game state (saved to localStorage)
var busy = false;        // true while the wheel or a reveal animation is running
var timerInt = null, timerT0 = 0;
var wheelAngle = 0, wheelKey = '';
var toastT = null, cfT = null;
var M = {};              // layout metrics
var tiles = [], keyEls = {};
var setup = { n: 3, players: [] };

/* ================= helpers ================= */

function $(id) { return document.getElementById(id); }
function setC(el, c, on) { if (on) el.classList.add(c); else el.classList.remove(c); }
function px(n) { return Math.round(n) + 'px'; }
function fmt(n) {
  n = Math.round(n);
  var s = String(Math.abs(n)), o = '';
  while (s.length > 3) { o = ',' + s.slice(-3) + o; s = s.slice(0, -3); }
  return (n < 0 ? '-' : '') + s + o;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function isVowel(c) { return VOWELS.indexOf(c) >= 0; }
function isCons(c) { return ALPHA.indexOf(c) >= 0 && VOWELS.indexOf(c) < 0; }
function mod(a, n) { return ((a % n) + n) % n; }

// Fast, reliable taps on old Android (avoids the 300ms click delay and ghost clicks).
// Each element follows its own finger, so quick two-thumb typing registers every key.
function findTouch(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i];
  return null;
}
function tap(el, fn) {
  var sx = 0, sy = 0, tid = null, moved = false, touched = false;
  function release() { setTimeout(function () { touched = false; }, 700); }
  el.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    tid = t.identifier; sx = t.clientX; sy = t.clientY; moved = false; touched = true;
    el.classList.add('pressed');
  }, false);
  el.addEventListener('touchmove', function (e) {
    var t = findTouch(e.changedTouches, tid);
    if (!t) return;
    if (Math.abs(t.clientX - sx) > 14 || Math.abs(t.clientY - sy) > 14) { moved = true; el.classList.remove('pressed'); }
  }, false);
  el.addEventListener('touchcancel', function () { moved = true; tid = null; el.classList.remove('pressed'); release(); }, false);
  el.addEventListener('touchend', function (e) {
    if (!findTouch(e.changedTouches, tid)) return;
    tid = null;
    el.classList.remove('pressed');
    if (!moved) { if (e.cancelable) e.preventDefault(); fn.call(el, e); }
    release();
  }, false);
  el.addEventListener('click', function (e) { if (touched) return; fn.call(el, e); }, false);
}

/* ================= puzzle layout ================= */

var PLACEMENTS = { 1: [[1]], 2: [[1, 2]], 3: [[0, 1, 2], [1, 2, 3]], 4: [[0, 1, 2, 3]] };
function rowCap(r) { return (r === 0 || r === 3) ? 12 : 14; }

function lineScore(lines) {
  var mx = 0, sum = 0, v = 0, i, mean;
  for (i = 0; i < lines.length; i++) { mx = Math.max(mx, lines[i].length); sum += lines[i].length; }
  mean = sum / lines.length;
  for (i = 0; i < lines.length; i++) v += (lines[i].length - mean) * (lines[i].length - mean);
  return mx * 1000 + v;
}

// Best way to split the words into contiguous lines that fit the row capacities.
function bestSplit(words, caps) {
  var n = caps.length, best = null;
  function rec(start, li, acc) {
    var end, line;
    if (li === n - 1) {
      line = words.slice(start).join(' ');
      if (!line || line.length > caps[li]) return;
      var lines = acc.concat([line]), sc = lineScore(lines);
      if (!best || sc < best.score) best = { lines: lines, score: sc };
      return;
    }
    for (end = start + 1; end <= words.length - (n - 1 - li); end++) {
      line = words.slice(start, end).join(' ');
      if (line.length > caps[li]) break;
      rec(end, li + 1, acc.concat([line]));
    }
  }
  rec(0, 0, []);
  return best;
}

function splitPuzzle(raw) {
  var text = String(raw || '').toUpperCase().replace(/[\r\n]+/g, '/').replace(/\t/g, ' ');
  var i, j, k, lines, rows, opts, caps, ok, b;
  if (text.indexOf('/') >= 0) {
    var parts = text.split('/');
    lines = [];
    for (i = 0; i < parts.length; i++) {
      var s = parts[i].replace(/\s+/g, ' ').replace(/^ | $/g, '');
      if (s) lines.push(s);
    }
    if (!lines.length) return { error: 'Type a puzzle.' };
    if (lines.length > 4) return { error: 'The board only has 4 rows.' };
    opts = PLACEMENTS[lines.length];
    for (i = 0; i < opts.length; i++) {
      ok = true;
      for (j = 0; j < lines.length; j++) if (lines[j].length > rowCap(opts[i][j])) ok = false;
      if (ok) return { lines: lines, rows: opts[i] };
    }
    return { error: 'A line is too long. Top and bottom rows hold 12 letters, middle rows hold 14.' };
  }
  var words = text.replace(/\s+/g, ' ').replace(/^ | $/g, '').split(' ');
  if (!words[0]) return { error: 'Type a puzzle.' };
  for (i = 0; i < words.length; i++) {
    if (words[i].length > 14) return { error: '"' + words[i] + '" is too long (14 letters max per row).' };
  }
  for (k = 1; k <= 4; k++) {
    if (k === 1 && words.length > 1 && words.join(' ').length > 12) continue;
    opts = PLACEMENTS[k]; b = null; rows = null;
    for (i = 0; i < opts.length; i++) {
      caps = [];
      for (j = 0; j < opts[i].length; j++) caps.push(rowCap(opts[i][j]));
      var r = bestSplit(words, caps);
      if (r && (!b || r.score < b.score)) { b = r; rows = opts[i]; }
    }
    if (b) return { lines: b.lines, rows: rows };
  }
  return { error: 'That puzzle is too long for the board.' };
}

// Build a puzzle object: cells carry row/col, the character and whether it is showing.
function buildPuzzle(raw, category, align) {
  var sp = splitPuzzle(raw), i, j, maxLen = 0, cells = [], hasLetter = false;
  if (sp.error) return sp;
  for (i = 0; i < sp.lines.length; i++) maxLen = Math.max(maxLen, sp.lines[i].length);
  var start = Math.floor((COLS - maxLen) / 2);
  for (i = 0; i < sp.lines.length; i++) {
    var line = sp.lines[i], row = sp.rows[i], edge = (row === 0 || row === 3);
    var minC = edge ? 1 : 0, maxEnd = edge ? 13 : 14;
    var col = align === 'center' ? Math.floor((COLS - line.length) / 2) : start;
    if (col < minC) col = minC;
    if (col + line.length > maxEnd) col = maxEnd - line.length;
    for (j = 0; j < line.length; j++) {
      var ch = line.charAt(j);
      if (ch === ' ') continue;
      var letter = ALPHA.indexOf(ch) >= 0;
      if (letter) hasLetter = true;
      cells.push({ r: row, c: col + j, ch: ch, s: !letter });
    }
  }
  if (!hasLetter) return { error: 'The puzzle needs at least one letter.' };
  return {
    category: String(category || '').toUpperCase().replace(/\s+/g, ' ').replace(/^ | $/g, ''),
    cells: cells, used: {}, solved: false, align: align || 'left'
  };
}

function hiddenCells(p, test) {
  var out = [], i, c;
  for (i = 0; i < p.cells.length; i++) { c = p.cells[i]; if (!c.s && test(c.ch)) out.push(c); }
  return out;
}
function hasHidden(p, test) { return hiddenCells(p, test).length > 0; }
function anyLetter() { return true; }

/* ================= state ================= */

function makeWheel() {
  var a = [], i;
  for (i = 0; i < 24; i++) a.push(SPECIAL[i] ? 0 : 100 + 50 * Math.floor(Math.random() * 18));
  return a;
}
function newState(players) {
  return { players: players, cur: 0, starter: 0, mode: 'reg', reg: null, bonus: null, pending: null, wheel: makeWheel() };
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function loadSaved() {
  try {
    var s = localStorage.getItem(STORE);
    if (!s) return null;
    var o = JSON.parse(s);
    if (o && o.players && o.players.length) return o;
  } catch (e) {}
  return null;
}
function P() { return S ? (S.mode === 'bonus' ? S.bonus : S.reg) : null; }

/* ================= DOM construction ================= */

function buildBoard() {
  var board = $('board'), r, c, t;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      t = document.createElement('div');
      t.appendChild(document.createElement('b'));
      board.appendChild(t);
      tiles.push(t);
    }
  }
}
function isCorner(i) { var r = Math.floor(i / COLS), c = i % COLS; return (r === 0 || r === 3) && (c === 0 || c === 13); }

function buildKeys() {
  var box = $('keys'), i, L, k;
  for (i = 0; i < ALPHA.length; i++) {
    L = ALPHA.charAt(i);
    k = document.createElement('div');
    k.className = 'key' + (isVowel(L) ? ' v' : '');
    k.textContent = L;
    box.appendChild(k);
    keyEls[L] = k;
    bindKey(k, L);
  }
}
function bindKey(k, L) { tap(k, function () { onKey(L); }); }

/* ================= rendering ================= */

function tileState(cell, st) {
  var t = tiles[cell.r * COLS + cell.c];
  t.className = 'tile pz' + (st === 'lit' ? ' lit' : st === 'on' ? ' on' : '');
}

function renderBoard() {
  var p = P(), i, c;
  for (i = 0; i < tiles.length; i++) {
    tiles[i].className = isCorner(i) ? 'tile off' : 'tile';
    tiles[i].firstChild.textContent = '';
  }
  if (!p) return;
  for (i = 0; i < p.cells.length; i++) {
    c = p.cells[i];
    tiles[c.r * COLS + c.c].firstChild.textContent = c.ch;
    tileState(c, c.s ? 'on' : 'pz');
  }
}

function renderKeys() {
  var p = P(), rows = (S && S.mode === 'bonus') ? BON_ROWS : REG_ROWS, all = rows.join(''), i, L;
  for (i = 0; i < ALPHA.length; i++) {
    L = ALPHA.charAt(i);
    keyEls[L].style.display = all.indexOf(L) >= 0 ? 'block' : 'none';
    setC(keyEls[L], 'used', !!(p && p.used[L]));
  }
}

function renderCat() { var p = P(); $('catText').textContent = p ? p.category : ''; }

function renderScores() {
  var h = '', i, p, box = $('scores'), els;
  for (i = 0; i < S.players.length; i++) {
    p = S.players[i];
    h += '<div class="sb ' + p.color + (i === S.cur ? ' act' : '') + '" data-i="' + i + '">' +
      '<div class="sbName">' + esc(p.name) + '</div>' +
      '<div class="sbTot">TOTAL ' + fmt(p.total) + '</div>' +
      '<div class="sbRound">' + fmt(p.round) + '</div></div>';
  }
  box.innerHTML = h;
  els = box.childNodes;
  for (i = 0; i < els.length; i++) bindScore(els[i]);
}
function bindScore(el) {
  tap(el, function () {
    if (busy) return;
    var i = parseInt(el.getAttribute('data-i'), 10);
    if (i === S.cur) return;
    S.cur = i; S.pending = null; save();
    renderScores(); updateRegUI();
    toast(S.players[i].name + "'s turn");
  });
}

function updateRegUI() {
  var p = S.reg, pl = S.players[S.cur], big = '', small = '';
  var spin = $('btnSpin'), solve = $('btnSolve');
  var consLeft = p && hasHidden(p, isCons);
  if (!p) {
    spin.textContent = 'LOAD PUZZLE';
    spin.className = 'btn gold xl' + (busy ? ' dis' : '');
    big = 'Ready to brew'; small = 'Load a puzzle and category to start the round';
  } else {
    spin.textContent = 'SPIN';
    spin.className = 'btn gold xl' + ((busy || p.solved || S.pending || !consLeft) ? ' dis' : '');
  }
  if (p && p.solved) {
    solve.textContent = 'CLEAR BOARD';
    solve.className = 'btn red lg' + (busy ? ' dis' : '');
    big = 'Solved!'; small = 'Clear the board for the next round';
  } else {
    solve.textContent = 'SOLVED';
    solve.className = 'btn green lg' + ((!p || busy) ? ' dis' : '');
  }
  if (p && !p.solved) {
    if (S.pending) { big = fmt(S.pending); small = pl.name + ', pick a consonant'; }
    else if (!consLeft) {
      big = pl.name;
      small = hasHidden(p, isVowel) ? 'No more consonants. Buy a vowel or solve' : 'Every letter is showing. Solve it!';
    } else { big = pl.name; small = 'Spin, buy a vowel (200) or solve'; }
  }
  $('stBig').textContent = big;
  $('stSmall').textContent = small;
  $('stBig').style.color = (p && !p.solved && pl) ? CHEX[pl.color] : '#ffe2a8';
  $('btnPass').className = 'btn brown sm half l' + ((busy || !p || p.solved || S.players.length < 2) ? ' dis' : '');
}

function renderBonusCard() {
  var b = S.bonus, cons = [], vow = '', i, h = '', L, els;
  $('bCat').textContent = b ? (b.category || 'BONUS ROUND') : 'LOAD A BONUS PUZZLE';
  if (b) for (i = 0; i < b.picks.length; i++) { L = b.picks[i]; if (isVowel(L)) vow = L; else cons.push(L); }
  for (i = 0; i < 3; i++) h += '<span class="ct' + (cons[i] ? '' : ' empty') + '" data-l="' + (cons[i] || '') + '">' + (cons[i] || '') + '</span>';
  h += '<span class="plus">+</span><span class="ct' + (vow ? '' : ' empty') + '" data-l="' + vow + '">' + vow + '</span>';
  $('bPick').innerHTML = h;
  els = $('bPick').getElementsByTagName('span');
  for (i = 0; i < els.length; i++) if (els[i].getAttribute('data-l')) bindUnpick(els[i]);
}
function bindUnpick(el) { tap(el, function () { unpick(el.getAttribute('data-l')); }); }

function updateBonusUI() {
  var b = S.bonus, fin = b && b.finished;
  $('bBtnRst').className = 'btn red lg' + ((!b || b.rstlne || fin || busy) ? ' dis' : '');
  $('bBtnRev').className = 'btn gold lg' + ((!b || !b.rstlne || b.revealed || !b.picks.length || fin || busy || timerInt) ? ' dis' : '');
  $('bBtnTimer').className = 'btn brown md' + ((!b || fin || timerInt || busy) ? ' dis' : '');
  var sv = $('bBtnSolve');
  if (fin) { sv.textContent = 'CLEAR BOARD'; sv.className = 'btn red xl' + (busy ? ' dis' : ''); }
  else { sv.textContent = 'SOLVED'; sv.className = 'btn green xl' + ((!b || busy) ? ' dis' : ''); }
  if (!timerInt) {
    if (b && b.finished) setTimerDisp(b.timeLeft || 0, b.won ? 'won' : 'zero');
    else setTimerDisp(10, '');
  }
}

function setTimerDisp(n, cls) {
  var t = $('bTimer');
  t.className = cls || '';
  t.firstChild.textContent = n;
}

function renderAll() {
  var bonus = S.mode === 'bonus';
  setC($('game'), 'bonus', bonus);
  $('side').style.display = bonus ? 'none' : 'block';
  $('bside').style.display = bonus ? 'block' : 'none';
  renderBoard(); renderKeys(); renderCat();
  if (bonus) { renderBonusCard(); updateBonusUI(); }
  else { renderScores(); updateRegUI(); }
  layout();
}

/* ================= layout ================= */

function layout() {
  var W = window.innerWidth || document.documentElement.clientWidth || 1024;
  var H = window.innerHeight || document.documentElement.clientHeight || 600;
  M.W = W; M.H = H;

  var sf = Math.max(12, Math.min(28, Math.round(Math.min(W, H) / 30)));
  $('setup').style.fontSize = sf + 'px';
  $('setupIn').style.width = px(Math.min(W - 2 * sf, sf * 26));

  var mf = Math.max(13, Math.min(22, Math.round(Math.min(W, H) / 30)));
  var mw = Math.min(W * 0.95, mf * 34), mb = $('mbox');
  $('modal').style.fontSize = mf + 'px';
  mb.style.width = px(mw);
  mb.style.left = px((W - mw) / 2);
  if (modalOpen()) refreshPreview();
  if (KB.fid) { layoutKb(); kbFit(true); }

  if (!S) return;
  var land = W >= H * 1.1, pad = Math.max(6, Math.round(Math.min(W, H) * 0.022));
  var mx, my, mW, mH, sx, sy, sw, sh;
  setC($('game'), 'port', !land);
  if (land) {
    sw = Math.round(Math.min(W * 0.25, H * 0.62));
    mx = pad; my = pad; mW = W - sw - pad * 3; mH = H - pad * 2;
    sx = W - sw - pad; sy = pad; sh = H - pad * 2;
  } else {
    mx = pad; my = pad; mW = W - pad * 2; mH = Math.round(H * 0.6);
    sx = pad; sy = my + mH + pad; sw = W - pad * 2; sh = H - sy - pad;
  }
  layoutMain(mx, my, mW, mH);
  layoutSide(sx, sy, sw, sh, land);
  layoutWheel();
}

function layoutMain(x, y, w, h) {
  var BW = 15.74, BH = 6.14;   // board size in tile-widths (14 x 4 tiles, gaps, frame)
  var rows = S.mode === 'bonus' ? BON_ROWS : REG_ROWS;
  var tw = Math.min(w / BW, h * 0.6 / BH), k = 0, catH = 0, gap = 0, it;
  for (it = 0; it < 60; it++) {
    catH = Math.max(16, tw * 0.82); gap = Math.max(4, tw * 0.28);
    k = Math.min((h - tw * BH - catH - gap * 2) / 3.3, w / (11 * 1.15), tw * 1.4);
    if (k >= tw * 0.8) break;
    tw *= 0.97;
  }
  var bw = tw * BW, bh = tw * BH, th = tw * 1.3, g = tw * 0.08, fp = tw * 0.35, kg = k * 0.15;
  var used = bh + gap + catH + gap + 3 * k + 2 * kg, ex = Math.max(0, h - used);
  var by = y + ex * 0.25, cy = by + bh + gap + ex * 0.25, ky = cy + catH + gap + ex * 0.25;
  var bx = x + (w - bw) / 2;

  var board = $('board'), i, r, c, t;
  board.style.left = px(bx); board.style.top = px(by);
  board.style.width = px(bw); board.style.height = px(bh);
  board.style.fontSize = tw + 'px';
  var fs = px(th * 0.74), lh = px(th);
  for (i = 0; i < tiles.length; i++) {
    r = Math.floor(i / COLS); c = i % COLS; t = tiles[i];
    t.style.left = px(fp + c * (tw + g)); t.style.top = px(fp + r * (th + g));
    t.style.width = px(tw); t.style.height = px(th);
    t.style.fontSize = fs; t.style.lineHeight = lh;
  }

  var cw = Math.min(w, bw * 0.62), cat = $('catbar');
  cat.style.left = px(x + (w - cw) / 2); cat.style.top = px(cy);
  cat.style.width = px(cw); cat.style.height = px(catH);
  cat.style.fontSize = px(catH * 0.58); cat.style.lineHeight = px(catH * 0.98);

  var ri, j, row, rw, L, el;
  for (ri = 0; ri < rows.length; ri++) {
    row = rows[ri];
    rw = row.length * k + (row.length - 1) * kg;
    for (j = 0; j < row.length; j++) {
      L = row.charAt(j); el = keyEls[L];
      el.style.left = px(x + (w - rw) / 2 + j * (k + kg));
      el.style.top = px(ky + ri * (k + kg));
      el.style.width = px(k); el.style.height = px(k);
      el.style.fontSize = px(k * 0.62); el.style.lineHeight = px(k);
    }
  }
  M.board = { x: x, y: by, w: w, h: bh };
  M.toastFs = Math.max(14, tw * 0.72);
}

function layoutSide(sx, sy, sw, sh, land) {
  var bonus = S.mode === 'bonus', el = bonus ? $('bside') : $('side'), n = S.players.length, u;
  if (land) u = bonus ? Math.min(sw / 11.5, sh / 25.4) : Math.min(sw / 11.5, sh / (14.8 + n * 3.9));
  else u = bonus ? Math.min(sw / 24, sh / 15.4) : Math.min(sw / 24, sh / Math.max(n * 3.9, 12.4));
  u = Math.max(8, u);
  el.style.left = px(sx); el.style.top = px(sy);
  el.style.width = px(sw); el.style.height = px(sh);
  el.style.fontSize = u.toFixed(2) + 'px';
  var inner = el.firstChild;
  inner.style.marginTop = '0px';
  var ch = inner.offsetHeight;
  if (ch < sh) inner.style.marginTop = px((sh - ch) / 2);
}

function layoutWheel() {
  var W = M.W, H = M.H, D = Math.floor(Math.min(W, H) * 0.88), wrap = $('wheelWrap');
  M.wheelD = D;
  wrap.style.width = px(D); wrap.style.height = px(D);
  wrap.style.left = px((W - D) / 2); wrap.style.top = px((H - D) / 2 + D * 0.025);
  var pw = D * 0.04, ph = D * 0.085, pt = $('pointer'), pb = $('pointerB');
  pt.style.borderWidth = px(ph) + ' ' + px(pw) + ' 0 ' + px(pw);
  pt.style.left = px(D / 2 - pw); pt.style.top = px(-D * 0.035);
  pb.style.borderWidth = px(ph + 6) + ' ' + px(pw + 4) + ' 0 ' + px(pw + 4);
  pb.style.left = px(D / 2 - pw - 4); pb.style.top = px(-D * 0.035 - 3);
  var who = $('wheelWho');
  who.style.fontSize = px(Math.min(W, H) * 0.05);
  who.style.left = px(Math.min(W, H) * 0.03); who.style.top = px(Math.min(W, H) * 0.03);

function drawWheel() {

  var key = size + '|' + S.wheel.join(',');

    col = t === 'bankrupt' ? '#111111' : t === 'lose' ? '#fafafa' : WEDGE[vi++ % WEDGE.length];

  ctx.fillStyle = '#ffe9c2'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(hr * 0.36) + 'px WOCLogo, cursive';
  ctx.fillText('Wheel of', c, c - hr * 0.26);

// o.gap: ms between tiles lighting up (0 = all at once), o.hold: pause while lit,

function revealSeq(cells, o, done) {

  if (!n) { if (o.onLit) o.onLit(); if (done) done(); return; }
  if (o.noLight) { flip(); return; }
  if (!o.gap) {
    for (i = 0; i < n; i++) tileState(cells[i], 'lit');
    i = 0;
    if (o.onLit) o.onLit();
    setTimeout(flip, o.hold);
    return;

}

  var m = f.opts.mode;
  if (m === 'num') return /[0-9]/.test(ch);
  if (ch === '/') return !!f.opts.puzzle;
  if (m === 'name') return /[A-Z0-9 '\-&.]/.test(ch);
  return /[A-Z0-9 '\-&?!,.:]/.test(ch);
}
function autoShift(v) { return v === '' || v.charAt(v.length - 1) === ' '; }

// Update key labels (lower case for names) and dim keys this field can't use.
function kbRefresh() {
  var f = FIELDS[KB.fid], lower, i, key, c, ok;
  if (!f) return;
  lower = f.opts.mode === 'name' && !KB.shift;
  for (i = 0; i < KB.keys.length; i++) {
    key = KB.keys[i]; c = key.code;
    if (c.length === 1) { key.el.textContent = lower ? c.toLowerCase() : c; ok = kbAllowed(f, c); }
    else if (c === 'SHIFT') { ok = f.opts.mode === 'name'; setC(key.el, 'on', ok && KB.shift); }
    else if (c === 'NL') ok = !!f.opts.puzzle;
    else if (c === 'SPACE') ok = f.opts.mode !== 'num';
    else ok = true;
    setC(key.el, 'dis', !ok);
  }
}

function kbSet(f, v) {
  f.value = v;
  KB.fresh = false;
  KB.shift = f.opts.mode === 'name' && autoShift(v);
  renderField(f.id);
  if (KB.fid === f.id) kbRefresh();
  if (f.opts.onChange) f.opts.onChange(v);
}
// keepCase: from a hardware keyboard, where the typed case is already right.
function kbInsert(ch, keepCase) {
  var f = FIELDS[KB.fid], up = ch.toUpperCase(), v;
  if (!f || !kbAllowed(f, up)) return;
  if (f.opts.mode === 'name') { if (!keepCase) ch = KB.shift ? up : ch.toLowerCase(); }
  else ch = up;
  v = KB.fresh ? '' : f.value;     // number fields: first key replaces the old value
  if (v.length >= f.opts.max) return;
  kbSet(f, v + ch);
}
function kbPress(code) {
  var f = FIELDS[KB.fid];
  if (!f) return;
  if (code === 'DONE') kbClose();
  else if (code === 'SHIFT') { if (f.opts.mode === 'name') { KB.shift = !KB.shift; kbRefresh(); } }
  else if (code === 'DEL') kbSet(f, f.value.slice(0, -1));
  else if (code === 'CLEAR') kbSet(f, '');
  else if (code === 'SPACE') kbInsert(' ');
  else if (code === 'NL') kbInsert('/');
  else kbInsert(code);
}

function kbOpen(id) {
  var prev = KB.fid, f = FIELDS[id];
  if (!f) return;
  KB.fid = id;
  KB.shift = f.opts.mode === 'name' && autoShift(f.value);
  KB.fresh = f.opts.mode === 'num';
  if (prev && prev !== id) renderField(prev);
  $('kb').style.display = 'block';
  layoutKb();
  kbRefresh();
  renderField(id);
  kbFit(true);
}
function kbClose() {
  var prev = KB.fid;
  KB.fid = null; KB.fresh = false;
  if (prev) renderField(prev);
  $('kb').style.display = 'none';
  kbFit(false);
}

// Make room for the keyboard and scroll the focused field (and its label) into view.
function kbFit(scroll) {
  var open = !!KB.fid, mb = $('mbox'), st = $('setup'), el, box, top;
  mb.style.maxHeight = open ? px(M.H - KB.h - M.H * 0.035) : '96%';
  st.style.paddingBottom = open ? px(KB.h) : '0px';
  if (!open || !scroll) return;
  el = $(KB.fid);
  if (!el) return;
  box = modalOpen() ? mb : st;
  top = 0;
  for (var n = el; n && n !== box; n = n.offsetParent) top += n.offsetTop;
  box.scrollTop = Math.max(0, top - el.offsetHeight * 1.4);
}

/* ================= modals ================= */

function openModal(html) {
  kbClose();
  $('mbox').innerHTML = html;
  $('modal').style.display = 'block';
  $('mbox').scrollTop = 0;
}
function closeModal() {
  kbClose();
  $('modal').style.display = 'none';
  $('mbox').innerHTML = '<div id="prev"></div>';
  bindFields();
}
function modalOpen() { return $('modal').style.display === 'block'; }

function confirmBox(msg, yes, fn) {
  openModal('<div class="mmsg">' + esc(msg) + '</div>' +
    '<div class="cf"><div id="cNo" class="btn brown lg half l">CANCEL</div><div id="cYes" class="btn red lg half r">' + yes + '</div></div>');
  tap($('cNo'), closeModal);
  tap($('cYes'), function () { closeModal(); fn(); });
}

var loaderState = { hide: false, align: 'left' };

function openLoader() {
  if (busy) return;
  var bonus = S.mode === 'bonus', i, chips = '';
  for (i = 0; i < CATS.length; i++) chips += '<span class="chip" data-c="' + esc(CATS[i]) + '">' + esc(CATS[i]) + '</span>';
  openModal(
    '<div class="cf"><div id="mX" class="btn brown mb l">CANCEL</div><div id="mOk" class="btn green mb r">LOAD</div>' +
    '<div class="mtitle">' + (bonus ? 'Bonus Puzzle' : 'Load Puzzle') + '</div></div>' +
    '<div class="mlbl">CATEGORY</div>' + fieldHtml('inCat') +
    '<div class="chips">' + chips + '</div>' +
    '<div class="mlbl">PUZZLE <span class="hint">Lines wrap automatically. NEW LINE forces a break.</span></div>' + fieldHtml('inPz') +
    '<div id="mErr"></div><div id="prev"></div>' +
    '<div class="cf"><div id="tHide" class="tog' + (loaderState.hide ? ' on' : '') + '">HIDE WHILE TYPING</div>' +
    '<div id="tAlign" class="tog' + (loaderState.align === 'center' ? ' on' : '') + '">CENTER EACH LINE</div></div>');
  addField('inCat', '', { mode: 'upper', max: 40, placeholder: 'Tap to type, or pick one below' });
  addField('inPz', '', {
    mode: 'upper', max: 70, puzzle: true, placeholder: 'Tap to type the puzzle',
    onChange: queuePreview, mask: function () { return loaderState.hide; }
  });
  bindFields();
  var chipEls = $('mbox').getElementsByTagName('span');
  for (i = 0; i < chipEls.length; i++) if (chipEls[i].className === 'chip') bindChip(chipEls[i]);
  tap($('mX'), closeModal);
  tap($('mOk'), function () {
    var r = buildPuzzle(fieldVal('inPz'), fieldVal('inCat'), loaderState.align);
    if (r.error) { $('mErr').textContent = r.error; return; }
    closeModal();
    loadPuzzle(r);
  });
  tap($('tHide'), function () {
    loaderState.hide = !loaderState.hide;
    setC($('tHide'), 'on', loaderState.hide);
    renderField('inPz');
    refreshPreview();
  });
  tap($('tAlign'), function () {
    loaderState.align = loaderState.align === 'center' ? 'left' : 'center';
    setC($('tAlign'), 'on', loaderState.align === 'center');
    refreshPreview();
  });
  refreshPreview();
}
function bindChip(el) { tap(el, function () { setFieldVal('inCat', el.getAttribute('data-c')); }); }

// Redraw the preview just after a key press, so fast typing stays responsive.
var previewT = null;
function queuePreview() { clearTimeout(previewT); previewT = setTimeout(refreshPreview, 60); }

function refreshPreview() {
  var box = $('prev');
  if (!box || !$('inPz') || !modalOpen()) return;
  var raw = fieldVal('inPz'), r = raw.replace(/[\s\/]/g, '') ? buildPuzzle(raw, '', loaderState.align) : null;
  $('mErr').textContent = r && r.error ? r.error : '';
  var w = box.offsetWidth, tw = w / 15.74, th = tw * 1.3, g = tw * 0.08, fp = tw * 0.35, h = '', i, rr, cc;
  var map = {};
  if (r && r.cells) for (i = 0; i < r.cells.length; i++) map[r.cells[i].r * COLS + r.cells[i].c] = r.cells[i].ch;
  h += '<div style="position:absolute;left:0;top:0;width:' + px(w) + ';height:' + px(tw * 6.14) + ';border-radius:' + px(tw * 0.3) + ';background:#1c0d05;border:' + px(Math.max(2, tw * 0.15)) + ' solid #c8913f"></div>';
  for (i = 0; i < 56; i++) {
    if (isCorner(i)) continue;
    rr = Math.floor(i / COLS); cc = i % COLS;
    var ch = map[i], cls = 'tile';
    if (ch !== undefined) cls += loaderState.hide ? ' pz' : ' pz on';
    h += '<div class="' + cls + '" style="left:' + px(fp + cc * (tw + g)) + ';top:' + px(fp + rr * (th + g)) +
      ';width:' + px(tw) + ';height:' + px(th) + ';font-size:' + px(th * 0.74) + ';line-height:' + px(th) + '"><b>' +
      (ch !== undefined ? esc(ch) : '') + '</b></div>';
  }
  box.innerHTML = h;
  box.style.height = px(tw * 6.14);
}

function loadPuzzle(p) {
  if (S.mode === 'bonus') {
    stopTimer();
    p.rstlne = false; p.picks = []; p.revealed = false; p.finished = false;
    S.bonus = p;
  } else {
    if (S.reg && S.reg.solved) resetRound();
    S.reg = p; S.pending = null; S.wheel = makeWheel();
  }
  save(); renderAll();
}

function openMenu() {
  if (busy) return;
  var bonus = S.mode === 'bonus', items, i, h;
  items = bonus ?
    [['LOAD BONUS PUZZLE', openLoader], ['CLEAR BOARD', menuClear], ['BACK TO MAIN GAME', exitBonus], ['NEW GAME', confirmNew]] :
    [['LOAD PUZZLE', openLoader], ['CLEAR BOARD', menuClear], ['EDIT SCORES', openScores], ['BONUS ROUND', enterBonus], ['NEW GAME', confirmNew]];
  h = '<div class="cf"><div id="mX" class="btn brown mb r">CLOSE</div><div class="mtitle" style="text-align:left">MENU</div></div>';
  for (i = 0; i < items.length; i++) h += '<div id="mi' + i + '" class="btn ' + (i === 0 ? 'gold' : 'brown') + ' mitem">' + items[i][0] + '</div>';
  openModal(h);
  tap($('mX'), closeModal);
  for (i = 0; i < items.length; i++) bindMenu($('mi' + i), items[i][1]);
}
function bindMenu(el, fn) { tap(el, function () { closeModal(); fn(); }); }

function menuClear() {
  var p = P();
  if (!p) { toast('The board is already clear'); return; }
  var done = S.mode === 'bonus' ? p.finished : p.solved;
  var go = S.mode === 'bonus' ? clearBonus : clearBoard;
  if (done) go();
  else confirmBox('Clear the board? This puzzle has not been solved yet.', 'CLEAR', go);
}

function confirmNew() {
  confirmBox('Start a new game? All scores will be reset.', 'NEW GAME', function () {
    stopTimer();
    goSetup();
  });
}

function openScores() {
  var h = '<div class="cf"><div id="mX" class="btn brown mb l">CANCEL</div><div id="mOk" class="btn green mb r">SAVE</div><div class="mtitle">Scores</div></div>' +
    '<div class="ehead"><span class="en">NAME</span><span>ROUND</span><span>TOTAL</span></div>', i, p;
  for (i = 0; i < S.players.length; i++) {
    p = S.players[i];
    h += '<div class="erow">' + fieldHtml('en' + i, 'en') + fieldHtml('er' + i) + fieldHtml('et' + i) + '</div>';
  }
  openModal(h);
  for (i = 0; i < S.players.length; i++) {
    p = S.players[i];
    $('en' + i).style.borderLeftColor = CHEX[p.color];
    addField('en' + i, p.name, { mode: 'name', max: 14, placeholder: CNAME[p.color] });
    addField('er' + i, p.round, { mode: 'num', max: 7, placeholder: '0' });
    addField('et' + i, p.total, { mode: 'num', max: 8, placeholder: '0' });
  }
  bindFields();
  tap($('mX'), closeModal);
  tap($('mOk'), function () {
    for (var j = 0; j < S.players.length; j++) {
      var nm = fieldVal('en' + j).replace(/^\s+|\s+$/g, '');
      S.players[j].name = nm || CNAME[S.players[j].color];
      S.players[j].round = parseInt(fieldVal('er' + j), 10) || 0;
      S.players[j].total = parseInt(fieldVal('et' + j), 10) || 0;
    }
    closeModal(); save(); renderAll();
  });
}

/* ================= setup screen ================= */

function readSetupNames() {
  for (var i = 0; i < setup.n; i++) {
    if (FIELDS['pn' + i]) setup.players[i].name = FIELDS['pn' + i].value;
  }
}

function renderSetup() {
  var h = '', i, j, c;
  for (i = 1; i <= 4; i++) h += '<span class="cnt' + (i === setup.n ? ' sel' : '') + '" data-n="' + i + '">' + i + '</span>';
  $('countRow').innerHTML = h;
  var cnts = $('countRow').childNodes;
  for (i = 0; i < cnts.length; i++) bindCount(cnts[i]);

  h = '';
  for (i = 0; i < setup.n; i++) {
    c = setup.players[i].color;
    h += '<div class="prow"><span class="plbl">' + (i + 1) + '</span>' + fieldHtml('pn' + i);
    for (j = 0; j < COLORS.length; j++) {
      h += '<span class="sw ' + COLORS[j] + (COLORS[j] === c ? ' sel' : '') + '" data-p="' + i + '" data-c="' + COLORS[j] + '"></span>';
    }
    h += '</div>';
  }
  $('pRows').innerHTML = h;
  for (i = 0; i < setup.n; i++) {
    addField('pn' + i, setup.players[i].name, { mode: 'name', max: 14, placeholder: CNAME[setup.players[i].color] });
  }
  bindFields();
  var sws = $('pRows').getElementsByTagName('span');
  for (i = 0; i < sws.length; i++) if (sws[i].getAttribute('data-c')) bindSwatch(sws[i]);
  $('resumeWrap').style.display = loadSaved() ? 'block' : 'none';
}
function bindCount(el) {
  tap(el, function () { readSetupNames(); setup.n = parseInt(el.getAttribute('data-n'), 10); renderSetup(); });
}
function bindSwatch(el) {
  tap(el, function () {
    readSetupNames();
    var i = parseInt(el.getAttribute('data-p'), 10), c = el.getAttribute('data-c'), j;
    for (j = 0; j < setup.players.length; j++) {
      if (j !== i && setup.players[j].color === c) setup.players[j].color = setup.players[i].color;
    }
    setup.players[i].color = c;
    renderSetup();
  });
}

function goSetup() {
  var i, used = {};
  setup.players = [];
  if (S) {
    setup.n = S.players.length;
    for (i = 0; i < S.players.length; i++) {
      var nm = S.players[i].name === CNAME[S.players[i].color] ? '' : S.players[i].name;
      setup.players.push({ name: nm, color: S.players[i].color });
      used[S.players[i].color] = 1;
    }
  }
  for (i = 0; i < COLORS.length && setup.players.length < 4; i++) {
    if (!used[COLORS[i]]) setup.players.push({ name: '', color: COLORS[i] });
  }
  renderSetup();
  showScreen('setup');
}

function startGame() {
  readSetupNames();
  kbClose();
  var players = [], i, p;
  for (i = 0; i < setup.n; i++) {
    p = setup.players[i];
    players.push({ name: p.name.replace(/^\s+|\s+$/g, '') || CNAME[p.color], color: p.color, round: 0, total: 0 });
  }
  stopTimer();
  S = newState(players);
  save();
  showScreen('game');
  renderAll();
  openLoader();
}

function resumeGame() {
  var s = loadSaved();
  if (!s) return;
  S = s;
  if (!S.wheel || S.wheel.length !== 24) S.wheel = makeWheel();
  showScreen('game');
  renderAll();
}

function showScreen(id) {
  setC($('setup'), 'show', id === 'setup');
  setC($('game'), 'show', id === 'game');
  layout();
}

/* ================= init ================= */

function init() {
  buildBoard();
  buildKeys();
  buildKb();
  tap($('btnSpin'), onSpin);
  tap($('btnSolve'), onSolve);
  tap($('btnPass'), onPass);
  tap($('btnMenu'), openMenu);
  tap($('bBtnRst'), onRstlne);
  tap($('bBtnRev'), onReveal);
  tap($('bBtnTimer'), startTimer);
  tap($('bTimer'), startTimer);
  tap($('bBtnSolve'), onBonusSolve);
  tap($('bBtnLoad'), openLoader);
  tap($('bBtnMenu'), openMenu);
  tap($('btnStart'), startGame);
  tap($('btnResume'), resumeGame);

  // Stop the page from scrolling or bouncing, except inside scrollable panels.
  document.addEventListener('touchmove', function (e) {
    var n = e.target;
    while (n && n !== document.body) {
      if (n.classList && n.classList.contains('scroll')) return;
      n = n.parentNode;
    }
    if (e.cancelable) e.preventDefault();
  }, false);
  document.addEventListener('touchstart', function () {}, false);

  // A physical keyboard (desktop browser, USB keyboard) types into the focused field too.
  document.addEventListener('keydown', function (e) {
    if (!KB.fid) return;
    var k = e.keyCode;
    if (k === 8) { e.preventDefault(); kbPress('DEL'); }
    else if (k === 13 || k === 27) { e.preventDefault(); kbPress('DONE'); }
  }, false);
  document.addEventListener('keypress', function (e) {
    if (!KB.fid) return;
    var c = e.charCode || e.which;
    if (!c || c < 32) return;
    e.preventDefault();
    kbInsert(String.fromCharCode(c), true);
  }, false);

  var rt = null;
  function onResize() { clearTimeout(rt); rt = setTimeout(layout, 120); }
  window.addEventListener('resize', onResize, false);
  window.addEventListener('orientationchange', onResize, false);

  S = null;
  var saved = loadSaved();
  if (saved) S = saved;
  goSetup();
  S = null;
  setTimeout(layout, 300);
  setTimeout(layout, 1200);
}

init();

// Test hook (used by the automated checks; harmless in the app).
window.WOC = {
  state: function () { return S; },
  forceSpin: function (idx) { var r = Math.random; Math.random = function () { Math.random = r; return (idx + 0.5) / 24; }; onSpin(); },
  buildPuzzle: buildPuzzle
};

})();
</script>
